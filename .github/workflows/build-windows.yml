name: Build Windows App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows you to trigger the build manually from the GitHub UI

jobs:
  build:
    # Crucial: Flutter requires a Windows runner to compile a Windows desktop app natively
    runs-on: windows-latest

    steps:
      # Step 1: Check out the repository source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up the Flutter environment with caching enabled to prevent step timeouts
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # Caches dependencies to speed up future runs and avoid network drops

      # Step 3: Fetch all Flutter dependencies cleanly
      - name: Install Dependencies
        run: flutter pub get

      # Step 4: Statically analyze the Dart code to guarantee build safety
      - name: Analyze Project Code
        run: flutter analyze

      # Step 5: Explicitly enable Windows desktop support inside the runner environment
      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      # Step 6: Build the native release executable bundle
      - name: Build Windows Release Executable
        run: flutter build windows --release

      # Step 7: Bundle and upload the build artifacts so you can download them on your Mac
      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app-release
          # This paths captures the absolute contents of the release runner build directory
          path: build/windows/x64/runner/Release/
          if-no-files-found: error # Immediately flags an issue if the build directory is empty
